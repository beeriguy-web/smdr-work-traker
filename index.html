<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הזמנת עבודה | שמדר טכנולוגיות</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body {
            background: #eef2f7;
            font-family: Arial, 'Segoe UI', sans-serif;
            font-size: 15px;
        }

        /* ── Toolbar ── */
        .toolbar {
            background: #bc2129;
            color: #fff;
            padding: 10px 18px;
            position: sticky;
            top: 0;
            z-index: 200;
            box-shadow: 0 2px 8px rgba(0,0,0,.35);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .toolbar-title { font-size: 1.05rem; font-weight: 700; }
        .toolbar .btn { font-size: 0.85rem; padding: 6px 14px; }

        /* ── Card ── */
        .form-card {
            max-width: 860px;
            margin: 22px auto 60px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 3px 16px rgba(0,0,0,.1);
            overflow: hidden;
        }

        /* ── Form header ── */
        .form-header {
            background: #bc2129;
            color: #fff;
            padding: 18px 24px;
            text-align: center;
        }
        .form-header .co-name { font-size: 1.3rem; font-weight: 700; }
        .form-header .form-title { font-size: 0.95rem; opacity: .85; margin-top: 3px; }

        /* ── Section label ── */
        .sec-label {
            background: #fbe4e4;
            border-right: 4px solid #bc2129;
            padding: 5px 12px;
            font-weight: 700;
            font-size: 0.9rem;
            color: #bc2129;
            margin: 18px 0 10px;
            border-radius: 0 4px 4px 0;
        }

        .form-label { font-weight: 600; font-size: 0.88rem; color: #333; margin-bottom: 3px; }
        .form-control, .form-select {
            font-size: 0.9rem;
            border-color: #e3cfcf;
        }
        .form-control:focus {
            border-color: #bc2129;
            box-shadow: 0 0 0 .18rem rgba(188,33,41,.22);
        }
        .form-control[readonly] {
            background: #f4f7fb;
            color: #333;
        }

        /* ── Items table ── */
        #items-table { width: 100%; border-collapse: collapse; }
        #items-table th {
            background: #bc2129;
            color: #fff;
            padding: 7px 6px;
            font-size: 0.82rem;
            text-align: center;
            border: 1px solid #d6343e;
        }
        #items-table td { border: 1px solid #e4d0d0; padding: 6px 3px; }
        #items-table td input {
            border: none;
            width: 100%;
            padding: 5px 6px;
            font-size: 0.88rem;
            background: transparent;
            outline: none;
        }
        #items-table td input:focus { background: #fff0f0; }
        .row-num { text-align: center; background: #f4f7fb; color: #888; font-size: 0.8rem; width: 36px; }
        #items-table tr:nth-child(even) td { background: #fafbfd; }

        /* ── Approval ── */
        .approval-wrap { border-top: 2px solid #bc2129; margin-top: 26px; padding-top: 4px; }

        /* ── Signature canvas ── */
        .sig-wrap {
            border: 2px solid #e3cfcf;
            border-radius: 6px;
            background: #fff;
            position: relative;
            overflow: hidden;
        }
        #sig-canvas {
            display: block;
            width: 100%;
            height: 130px;
            touch-action: none;
            cursor: crosshair;
        }
        .sig-clear-btn {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(190,40,40,.82);
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 2px 10px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .sig-clear-btn:hover { background: #c00; }
        .sig-hint { font-size: 0.75rem; color: #999; margin-top: 3px; }

        /* ── Autocomplete ── */
        .ac-wrap { position: relative; }
        .ac-box {
            position: absolute;
            background: #fff;
            border: 1px solid #d8b0b0;
            border-radius: 6px;
            box-shadow: 0 4px 16px rgba(0,0,0,.15);
            z-index: 300;
            width: 100%;
            max-height: 230px;
            overflow-y: auto;
            top: calc(100% + 2px);
            right: 0;
            display: none;
        }
        .ac-item {
            padding: 7px 14px;
            cursor: pointer;
            font-size: 0.87rem;
            border-bottom: 1px solid #f0f0f0;
        }
        .ac-item:hover, .ac-item.ac-active { background: #fbe9e9; }

        /* ── Contact rows ── */
        .contact-row { background: #f8fafc; border-radius: 7px; padding: 8px 10px; margin-bottom: 6px; border: 1px solid #f0dcdc; }

        /* ── Footer note ── */
        .form-footer { font-size: 0.72rem; color: #aaa; margin-top: 18px; text-align: left; direction: ltr; }

        /* ── Toast ── */
        .toast-msg {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #bc2129;
            color: #fff;
            padding: 10px 24px;
            border-radius: 24px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity .3s;
            z-index: 999;
            pointer-events: none;
        }
        .toast-msg.show { opacity: 1; }

        /* ── Job log ── */
        .joblog-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            z-index: 500;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .joblog-card {
            background: #fff;
            border-radius: 10px;
            max-width: 760px;
            width: 100%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,.3);
        }
        .joblog-header {
            background: #bc2129;
            color: #fff;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
        }
        .joblog-close { background: none; border: none; color: #fff; font-size: 1.1rem; cursor: pointer; }
        .joblog-body-wrap { overflow-y: auto; padding: 10px 14px; }
        .joblog-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
        .joblog-table th {
            background: #fbe4e4;
            color: #bc2129;
            padding: 6px 8px;
            text-align: right;
            border: 1px solid #e4d0d0;
            position: sticky;
            top: 0;
        }
        .joblog-table td { padding: 6px 8px; border: 1px solid #e4d0d0; text-align: right; }
        .joblog-actions {
            padding: 10px 14px;
            border-top: 1px solid #e4d0d0;
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        @media (max-width: 600px) {
            .toolbar-title { font-size: 0.9rem; }
            .form-card { margin: 10px 6px 50px; border-radius: 8px; }
            #items-table th, #items-table td { font-size: 0.75rem; }
        }

        /* ── Print / Save-as-PDF styles ── */
        @media print {
            @page { margin: 12mm 10mm; }

            /* hide all interactive UI */
            .toolbar,
            .d-flex.gap-2.mt-2,
            .form-footer,
            .sig-clear-btn,
            .sig-hint,
            .toast-msg,
            .joblog-overlay,
            #pdf-zone { display: none !important; }

            body { background: #fff !important; font-size: 11pt; margin: 0; }

            .form-card {
                box-shadow: none !important;
                margin: 0 !important;
                max-width: 100% !important;
                border-radius: 0 !important;
            }

            /* preserve background colors in print */
            .form-header,
            #items-table th,
            .sec-label {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .form-control {
                border: 1px solid #bbb !important;
                box-shadow: none !important;
            }

            #items-table { page-break-inside: avoid; }
        }

/* ── Signature pad ── */
(function () {
    const canvas = document.getElementById('sig-canvas');
    const ctx    = canvas.getContext('2d');
    let drawing  = false;
    let lastX = 0, lastY = 0;

    function pos(e) {
        const rect  = canvas.getBoundingClientRect();
        const scaleX = canvas.width  / rect.width;
        const scaleY = canvas.height / rect.height;
        const src = e.touches ? e.touches[0] : e;
        return [(src.clientX - rect.left) * scaleX,
                (src.clientY - rect.top)  * scaleY];
    }

    function startDraw(e) {
        drawing = true;
        [lastX, lastY] = pos(e);
    }
    function draw(e) {
        if (!drawing) return;
        const [x, y] = pos(e);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(x, y);
        ctx.strokeStyle = '#bc2129';
        ctx.lineWidth   = 2.8;
        ctx.lineCap     = 'round';
        ctx.lineJoin    = 'round';
        ctx.stroke();
        [lastX, lastY] = [x, y];
    }
    function endDraw() { drawing = false; }

    canvas.addEventListener('mousedown',  startDraw);
    canvas.addEventListener('mousemove',  draw);
    canvas.addEventListener('mouseup',    endDraw);
    canvas.addEventListener('mouseleave', endDraw);

    canvas.addEventListener('touchstart', e => { e.preventDefault(); startDraw(e); }, { passive: false });
    canvas.addEventListener('touchmove',  e => { e.preventDefault(); draw(e); },      { passive: false });
    canvas.addEventListener('touchend',   endDraw);
})();

function clearSignature() {
    const canvas = document.getElementById('sig-canvas');
    canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
}

function getSignatureDataUrl() {
    const canvas = document.getElementById('sig-canvas');
    const blank  = document.createElement('canvas');
    blank.width  = canvas.width;
    blank.height = canvas.height;
    if (canvas.toDataURL() === blank.toDataURL()) return null;
    return canvas.toDataURL('image/png');
}

let formContacts = [{ name:'', phone:'', email:'' }];
renderContacts();

function renderContacts() {
    const container = document.getElementById('contacts-list');
    container.innerHTML = formContacts.map((c, i) =>
        '<div class="contact-row" data-idx="' + i + '">' +
        '<div class="row g-2 align-items-center">' +
        '<div class="col-md-4 ac-wrap">' +
        '<input id="ct-name-' + i + '" class="form-control form-control-sm" value="' + c.name.replace(/"/g,'&quot;') + '" placeholder="שם איש קשר" oninput="onContactInput(this,' + i + ')" autocomplete="off">' +
        '<div class="ac-box" id="ct-ac-' + i + '"></div>' +
        '</div>' +
        '<div class="col-md-3">' +
        '<input id="ct-phone-' + i + '" class="form-control form-control-sm" type="tel" value="' + c.phone + '" placeholder="טלפון">' +
        '</div>' +
        '<div class="col-md-4">' +
        '<input id="ct-email-' + i + '" class="form-control form-control-sm" type="email" value="' + c.email + '" placeholder="מייל">' +
        '</div>' +
        '<div class="col-auto">' +
        (formContacts.length > 1 ? '<button class="btn btn-sm btn-outline-danger" onclick="removeContact(' + i + ')">✕</button>' : '') +
        '</div></div></div>'
    ).join('');
    document.getElementById('btn-add-contact').style.display =
        formContacts.length >= 5 ? 'none' : '';
}

function addContact() {
    if (formContacts.length >= 5) return;
    syncContactsFromDOM();
    formContacts.push({ name:'', phone:'', email:'' });
    renderContacts();
}

function removeContact(idx) {
    formContacts.splice(idx, 1);
    renderContacts();
}

function collectContacts() {
    const rows = document.querySelectorAll('.contact-row');
    return [...rows].map(row => {
        const ins = row.querySelectorAll('input');
        return { name: ins[0].value.trim(), phone: ins[1].value.trim(), email: ins[2].value.trim() };
    });
}

function onClientInput(val) {
    const box = document.getElementById('client-ac');
    const matches = Object.keys(CONTACTS_DB).filter(k => k.includes(val.trim()));
    if (!val.trim() || !matches.length) { box.style.display = 'none'; return; }
    box.innerHTML = matches.map(m => '<div class="ac-item">' + m + '</div>').join('');
    box.style.display = 'block';
    box.onmousedown = function(e) {
        const item = e.target.closest('.ac-item');
        if (!item) return;
        e.preventDefault();
        selectClient(item.textContent);
    };
}

function selectClient(name) {
    document.getElementById('f-client').value = name;
    document.getElementById('client-ac').style.display = 'none';
    // save current contact values then re-render
    syncContactsFromDOM();
    renderContacts();
}

const _ctMatches = {};

function onContactInput(input, idx) {
    const client = (document.getElementById('f-client').value || '').trim();
    const dbList = CONTACTS_DB[client] || [];
    const val = input.value;
    const box = document.getElementById('ct-ac-' + idx);
    const matches = dbList.filter(c => c.n.includes(val));
    _ctMatches[idx] = matches;
    if (!val || !matches.length) { box.style.display = 'none'; return; }
    box.innerHTML = matches.slice(0,30).map((c, mi) =>
        '<div class="ac-item" data-mi="' + mi + '">' + c.n + (c.p ? ' — ' + c.p : '') + '</div>'
    ).join('');
    box.style.display = 'block';
    box.onmousedown = function(e) {
        const item = e.target.closest('.ac-item');
        if (!item) return;
        e.preventDefault();
        const c = (_ctMatches[idx] || [])[parseInt(item.dataset.mi)];
        if (!c) return;
        document.getElementById('ct-name-' + idx).value = c.n;
        document.getElementById('ct-phone-' + idx).value = c.p || '';
        document.getElementById('ct-email-' + idx).value = c.e || '';
        box.style.display = 'none';
        syncContactsFromDOM();
    };
}

function selectContact(idx, mi) {
    const c = (_ctMatches[idx] || [])[mi];
    if (!c) return;
    document.getElementById('ct-name-' + idx).value = c.n;
    document.getElementById('ct-phone-' + idx).value = c.p || '';
    document.getElementById('ct-email-' + idx).value = c.e || '';
    document.getElementById('ct-ac-' + idx).style.display = 'none';
    syncContactsFromDOM();
}

function syncContactsFromDOM() {
    const rows = document.querySelectorAll('.contact-row');
    formContacts = [...rows].map(row => {
        const ins = row.querySelectorAll('input');
        return { name: ins[0].value.trim(), phone: ins[1].value.trim(), email: ins[2].value.trim() };
    });
}

// close dropdowns on outside click
document.addEventListener('click', e => {
    if (!e.target.closest('.ac-wrap')) {
        document.querySelectorAll('.ac-box').forEach(b => b.style.display='none');
    }
});

/* ── Duplicate form ── */
const DUPLICATE_KEY = 'wo_duplicate';

function duplicateForm() {
    const data = {
        to: v('f-to'), from: v('f-from'), date: v('f-date'),
        client: v('f-client'), site: v('f-site'),
        contacts: collectContacts(),
        wnum: v('f-wnum'), delivery: v('f-delivery'), corder: v('f-corder'),
        rows: collectRows(),
        desc: v('f-desc')
    };
    localStorage.setItem(DUPLICATE_KEY, JSON.stringify(data));
    window.open(window.location.href.split('?')[0], '_blank');
    toast('עותק נפתח בכרטיסייה חדשה ✓');
}

function applyDuplicateIfAny() {
    const raw = localStorage.getItem(DUPLICATE_KEY);
    if (!raw) return;
    localStorage.removeItem(DUPLICATE_KEY);

    let data;
    try { data = JSON.parse(raw); } catch { return; }

    document.getElementById('f-to').value     = data.to || '';
    document.getElementById('f-from').value   = data.from || '';
    if (data.date) document.getElementById('f-date').value = data.date;
    document.getElementById('f-client').value = data.client || '';
    document.getElementById('f-site').value   = data.site || '';
    document.getElementById('f-wnum').value   = data.wnum || '';
    if (data.delivery) document.getElementById('f-delivery').value = data.delivery;
    document.getElementById('f-corder').value = data.corder || '';
    document.getElementById('f-desc').value   = data.desc || '';

    formContacts = (data.contacts && data.contacts.length) ? data.contacts : [{ name:'', phone:'', email:'' }];
    renderContacts();

    document.getElementById('items-body').innerHTML = '';
    const rows = data.rows || [];
    if (rows.length) {
        rows.forEach(() => addRow());
        [...document.querySelectorAll('#items-body tr')].forEach((tr, i) => {
            const inputs = tr.querySelectorAll('input');
            inputs[0].value = rows[i].desc  || '';
            inputs[1].value = rows[i].qty   || '';
            inputs[2].value = rows[i].notes || '';
        });
    } else {
        for (let i = 0; i < 6; i++) addRow();
    }
}

/* ── Share link ── */
function copyLink() {
    const url = window.location.href.split('?')[0];
    navigator.clipboard.writeText(url).then(() => {
        const btn = document.getElementById('btn-share');
        btn.textContent = '✓ הועתק!';
        toast('הקישור הועתק — אפשר לשלוח לעובדים ✓');
        setTimeout(() => { btn.innerHTML = '🔗 שתף קישור'; }, 2000);
    }).catch(() => {
        prompt('העתק את הקישור:', url);
    });
}

/* ── Row management (no מספר קטלוגי) ── */
function addRow() {
    const tbody = document.getElementById('items-body');
    const n = tbody.rows.length + 1;
    const tr = document.createElement('tr');
    tr.innerHTML =
        `<td class="row-num">${n}</td>
         <td><input type="text" placeholder="תאור הפריט / עבודה"></td>
         <td><input type="number" min="0" placeholder="0" style="text-align:center"></td>
         <td><input type="text" placeholder="הערות"></td>`;
    tbody.appendChild(tr);
}

function removeRow() {
    const tbody = document.getElementById('items-body');
    if (tbody.rows.length > 1) tbody.deleteRow(tbody.rows.length - 1);
}

/* ── Helpers ── */
function v(id) { return (document.getElementById(id)?.value || '').trim(); }
function wnum() { const n = v('f-wnum'); return n ? `PR${n}/@` : ''; }

function fmtDate(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
}

function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2800);
}

function collectRows() {
    const rows = [];
    document.querySelectorAll('#items-body tr').forEach((tr, i) => {
        const inp = [...tr.querySelectorAll('input')].map(x => x.value.trim());
        rows.push({ n: i + 1, desc: inp[0], qty: inp[1], notes: inp[2] });
    });
    return rows;
}

function newForm() {
    if (!confirm('לאפס את הטופס ולהתחיל מחדש?')) return;
    ['f-client','f-site','f-wnum','f-delivery','f-corder','f-desc'].forEach(id => {
        document.getElementById(id).value = '';
    });
    formContacts = [{ name:'', phone:'', email:'' }];
    renderContacts();
    document.getElementById('f-date').valueAsDate  = new Date();
    document.getElementById('f-to').value          = 'גל - מנהל משרד טכני';
    document.getElementById('f-from').value        = 'גיא בארי - מנהל מכירות ופרויקטים';
    document.getElementById('f-appr-by').value     = 'גיא בארי';
    document.getElementById('items-body').innerHTML = '';
    for (let i = 0; i < 6; i++) addRow();
    clearSignature();
}

        corder: v('f-corder')
    });
    localStorage.setItem(JOB_LOG_KEY, JSON.stringify(log));
}

function sortedJobLog() {
    return getJobLog().slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
}

function openJobLog() {
    renderJobLog();
    document.getElementById('joblog-overlay').style.display = 'flex';
}

function closeJobLog() {
    document.getElementById('joblog-overlay').style.display = 'none';
}

function renderJobLog() {
    const rows = sortedJobLog();
    document.getElementById('joblog-body').innerHTML = rows.length
        ? rows.map(r =>
            `<tr>
                <td>${fmtDate(r.date) || '—'}</td>
                <td>${r.client || '—'}</td>
                <td>${r.project || '—'}</td>
                <td>${r.wnum || '—'}</td>
                <td>${r.corder || '—'}</td>
            </tr>`
          ).join('')
        : '<tr><td colspan="5" style="text-align:center;color:#999;padding:16px;">היומן ריק — עדיין לא נשמרו עבודות</td></tr>';
}

function clearJobLog() {
    if (!confirm('למחוק את כל יומן העבודות? פעולה זו לא ניתנת לביטול.')) return;
    localStorage.removeItem(JOB_LOG_KEY);
    renderJobLog();
}

function csvEscape(val) {
    const s = (val || '').toString();
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportJobLogCSV() {
    const rows = sortedJobLog();
    if (!rows.length) { toast('היומן ריק — אין מה לייצא'); return; }
    const header = ['תאריך', 'לקוח', 'פרויקט', "מס' עבודה", 'הזמנת לקוח'];
    const lines = [header.join(',')].concat(
        rows.map(r => [fmtDate(r.date), r.client, r.project, r.wnum, r.corder].map(csvEscape).join(','))
    );
    const csv = String.fromCharCode(0xFEFF) + lines.join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'יומן-עבודות.csv';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('הקובץ הורד — פתח עם Excel ✓');
}

function buildPdfHTML() {

    const secStyle = 'background:#fbe4e4;border-right:4px solid #bc2129;padding:4px 10px;font-weight:700;margin:10px 0 6px;color:#bc2129;direction:rtl;';
    const tdStyle  = 'padding:4px 6px;vertical-align:top;direction:rtl;';

        `<tr>

            <td style="border:1px solid #cbb;padding:8px 6px;">${sp(r.notes)}</td>
         </tr>`
    ).join('');

    const signatureHTML = sigData
        ? `<img src="${sigData}" style="max-height:70px;max-width:220px;display:block;margin-top:4px;">`

          <td style="width:25%;${tdStyle}">${lbl('תאריך')}${fmtDate(v('f-date'))}</td>

      </table>

      <!-- Client -->
      <div style="${secStyle}">פרטי${S}לקוח${S}ופרויקט</div>
      <table style="width:100%;margin-bottom:4px;border-collapse:collapse;">
        <tr>
          <td style="width:50%;${tdStyle}">${lbl('לקוח')}${sp(v('f-client'))}</td>
          <td style="width:50%;${tdStyle}">${lbl('פרויקט')}${sp(v('f-site'))}</td>
        </tr>
      </table>
      ${(() => {
        const cts = collectContacts().filter(c => c.name);
        if (!cts.length) return '';
        return '<table style="width:100%;margin-bottom:10px;border-collapse:collapse;font-size:0.92em;">' +
          '<thead><tr style="background:#fbe4e4;">' +
          '<th style="' + tdStyle + ';width:38%;">איש קשר</th>' +
          '<th style="' + tdStyle + ';width:30%;">טלפון</th>' +
          '<th style="' + tdStyle + ';width:32%;">מייל</th>' +
          '</tr></thead><tbody>' +
          cts.map(c =>
            '<tr><td style="' + tdStyle + '">' + sp(c.name) + '</td>' +
            '<td style="' + tdStyle + '">' + c.phone + '</td>' +
            '<td style="' + tdStyle + ';direction:ltr;">' + c.email + '</td></tr>'
          ).join('') +
          '</tbody></table>';
      })()}

      <!-- Work details (no מיכלול) -->
      <div style="${secStyle}">פרטי${S}עבודה</div>
      <table style="width:100%;margin-bottom:10px;border-collapse:collapse;">
        <tr>
          <td style="width:33%;${tdStyle}">${lbl("מס' עבודה")}${wnum()}</td>
          <td style="width:34%;${tdStyle}">${lbl('מועד אספקה')}${fmtDate(v('f-delivery'))}</td>
          <td style="width:33%;${tdStyle}">${lbl('הזמנת לקוח')}${sp(v('f-corder'))}</td>
        </tr>
      </table>

      <!-- Items (no מספר קטלוגי) -->
      <div style="${secStyle}">פירוט${S}פריטים</div>
      <table style="width:100%;margin-bottom:12px;border-collapse:collapse;">
        <thead>
          <tr style="background:#bc2129;color:#fff;">
            <th style="padding:6px 4px;width:36px;border:1px solid #d6343e;text-align:center;">#</th>
            <th style="padding:6px;border:1px solid #d6343e;">תאור</th>

          </tr>
        </thead>
        <tbody>${rowsHTML}</tbody>

      <!-- Description -->
      <div style="${secStyle}">תיאור${S}העבודה</div>
      <div style="border:1px solid #ccc;padding:10px;min-height:70px;white-space:pre-wrap;word-break:break-word;margin-bottom:14px;">${sp(v('f-desc'))}</div>

      <!-- Approval (no date) -->
      <div style="border-top:2px solid #bc2129;padding-top:10px;margin-top:10px;">
        <div style="${secStyle}">אישור</div>
        <table style="width:100%;border-collapse:collapse;">
          <tr>

            <td style="width:50%;${tdStyle}">${lbl('תפקיד')}${sp(v('f-appr-role'))}</td>

        </table>
      </div>

      <!-- Footer -->
      <div style="margin-top:18px;color:#999;font-size:0.75em;text-align:left;direction:ltr;">
        טופס מס': 27/06/2011 | גרסה דיגיטלית 2025
      </div>
    </div>`;
}
