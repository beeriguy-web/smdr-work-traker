<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הזמנת עבודה | שמדר טכנולוגיות</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body {
            background: #eef2f7;
            font-family: Arial, 'Segoe UI', sans-serif;
            font-size: 15px;
        }

        /* ── Toolbar ── */
        .toolbar {
            background: #bc2129;
            color: #fff;
            padding: 10px 18px;
            position: sticky;
            top: 0;
            z-index: 200;
            box-shadow: 0 2px 8px rgba(0,0,0,.35);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .toolbar-title { font-size: 1.05rem; font-weight: 700; }
        .toolbar .btn { font-size: 0.85rem; padding: 6px 14px; }

        /* ── Card ── */
        .form-card {
            max-width: 860px;
            margin: 22px auto 60px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 3px 16px rgba(0,0,0,.1);
            overflow: hidden;
        }

        /* ── Form header ── */
        .form-header {
            background: #bc2129;
            color: #fff;
            padding: 18px 24px;
            text-align: center;
        }
        .form-header .co-name { font-size: 1.3rem; font-weight: 700; }
        .form-header .form-title { font-size: 0.95rem; opacity: .85; margin-top: 3px; }
        .header-brand { display: flex; align-items: center; justify-content: center; gap: 12px; }
        .header-logo { width: 46px; height: 46px; flex-shrink: 0; }

        /* ── Section label ── */
        .sec-label {
            background: #fbe4e4;
            border-right: 4px solid #bc2129;
            padding: 5px 12px;
            font-weight: 700;
            font-size: 0.9rem;
            color: #bc2129;
            margin: 18px 0 10px;
            border-radius: 0 4px 4px 0;
        }

        .form-label { font-weight: 600; font-size: 0.88rem; color: #333; margin-bottom: 3px; }
        .form-control, .form-select {
            font-size: 0.9rem;
            border-color: #e3cfcf;
        }
        .form-control:focus {
            border-color: #bc2129;
            box-shadow: 0 0 0 .18rem rgba(188,33,41,.22);
        }
        .form-control[readonly] {
            background: #f4f7fb;
            color: #333;
        }

        /* ── Items table ── */
        #items-table { width: 100%; border-collapse: collapse; }
        #items-table th {
            background: #bc2129;
            color: #fff;
            padding: 7px 6px;
            font-size: 0.82rem;
            text-align: center;
            border: 1px solid #d6343e;
        }
        #items-table td { border: 1px solid #c9a3a3; padding: 6px 3px; }
        #items-table td input {
            border: none;
            width: 100%;
            padding: 5px 6px;
            font-size: 0.88rem;
            background: transparent;
            outline: none;
        }
        #items-table td input:focus { background: #fff0f0; }
        .row-num { text-align: center; background: #f4f7fb; color: #888; font-size: 0.8rem; width: 36px; }
        #items-table tr:nth-child(even) td { background: #fafbfd; }

        /* ── Approval ── */
        .approval-wrap { border-top: 2px solid #bc2129; margin-top: 26px; padding-top: 4px; }

        /* ── Signature canvas ── */
        .sig-wrap {
            border: 2px solid #e3cfcf;
            border-radius: 6px;
            background: #fff;
            position: relative;
            overflow: hidden;
        }
        #sig-canvas {
            display: block;
            width: 100%;
            height: 130px;
            touch-action: none;
            cursor: crosshair;
        }
        .sig-clear-btn {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(190,40,40,.82);
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 2px 10px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .sig-clear-btn:hover { background: #c00; }
        .sig-hint { font-size: 0.75rem; color: #999; margin-top: 3px; }

        /* ── Autocomplete ── */
        .ac-wrap { position: relative; }
        .ac-box {
            position: absolute;
            background: #fff;
            border: 1px solid #d8b0b0;
            border-radius: 6px;
            box-shadow: 0 4px 16px rgba(0,0,0,.15);
            z-index: 300;
            width: 100%;
            max-height: 230px;
            overflow-y: auto;
            top: calc(100% + 2px);
            right: 0;
            display: none;
        }
        .ac-item {
            padding: 7px 14px;
            cursor: pointer;
            font-size: 0.87rem;
            border-bottom: 1px solid #f0f0f0;
        }
        .ac-item:hover, .ac-item.ac-active { background: #fbe9e9; }

        /* ── Contact rows ── */
        .contact-row { background: #f8fafc; border-radius: 7px; padding: 8px 10px; margin-bottom: 6px; border: 1px solid #f0dcdc; }

        /* ── Footer note ── */
        .form-footer { font-size: 0.72rem; color: #aaa; margin-top: 18px; text-align: left; direction: ltr; }

        /* ── Toast ── */
        .toast-msg {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #bc2129;
            color: #fff;
            padding: 10px 24px;
            border-radius: 24px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity .3s;
            z-index: 999;
            pointer-events: none;
        }
        .toast-msg.show { opacity: 1; }

        @media (max-width: 600px) {
            .toolbar-title { font-size: 0.9rem; }
            .form-card { margin: 10px 6px 50px; border-radius: 8px; }
            #items-table th, #items-table td { font-size: 0.75rem; }
        }

        /* ── Print / Save-as-PDF styles ── */
        @media print {
            @page { margin: 12mm 10mm; }

            /* hide all interactive UI */
            .toolbar,
            .d-flex.gap-2.mt-2,
            .form-footer,
            .sig-clear-btn,
            .sig-hint,
            .toast-msg,
            #pdf-zone { display: none !important; }

            body { background: #fff !important; font-size: 11pt; margin: 0; }

            .form-card {
                box-shadow: none !important;
                margin: 0 !important;
                max-width: 100% !important;
                border-radius: 0 !important;
            }

            /* preserve background colors in print */
            .form-header,
            #items-table th,
            .sec-label {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .form-control {
                border: 1px solid #bbb !important;
                box-shadow: none !important;
            }

            #items-table { page-break-inside: avoid; }
        }
    </style>
</head>
<body>

<!-- ════ TOOLBAR ════ -->
<div class="toolbar">
    <span class="toolbar-title">📋 טופס הזמנת עבודה פנימית</span>
    <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-outline-light" onclick="newForm()">טופס חדש</button>
        <button class="btn btn-outline-light" onclick="copyLink()" id="btn-share" title="העתק קישור לטופס לשיתוף עם עובדים">🔗 שתף קישור</button>
        <button class="btn btn-outline-light" onclick="window.open('https://beeriguy-web.github.io/work-traker/', '_blank')" title="פתח את מעקב העבודות במשרד הטכני">📊 מעקב עבודות</button>
        <button class="btn btn-warning text-dark fw-bold" onclick="downloadPDF()">⬇ PDF</button>
        <button class="btn btn-success fw-bold" onclick="sendEmail()">✉ שלח במייל</button>
    </div>
</div>

function drawDefaultSignature() {
    const canvas = document.getElementById('sig-canvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.onload = function () {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
        const w = img.width * scale;
        const h = img.height * scale;
        ctx.drawImage(img, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
    };
    img.src = SIGNATURE_STAMP_SRC;
}
drawDefaultSignature();

(function () {
    const canvas = document.getElementById('sig-canvas');
    const ctx    = canvas.getContext('2d');
    let drawing  = false;
    let lastX = 0, lastY = 0;

    function pos(e) {
        const rect  = canvas.getBoundingClientRect();
        const scaleX = canvas.width  / rect.width;
        const scaleY = canvas.height / rect.height;
        const src = e.touches ? e.touches[0] : e;
        return [(src.clientX - rect.left) * scaleX,
                (src.clientY - rect.top)  * scaleY];
    }

    function startDraw(e) {
        drawing = true;
        [lastX, lastY] = pos(e);
    }
    function draw(e) {
        if (!drawing) return;
        const [x, y] = pos(e);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(x, y);
        ctx.strokeStyle = '#bc2129';
        ctx.lineWidth   = 2.8;
        ctx.lineCap     = 'round';
        ctx.lineJoin    = 'round';
        ctx.stroke();
        [lastX, lastY] = [x, y];
    }
    function endDraw() { drawing = false; }

    canvas.addEventListener('mousedown',  startDraw);
    canvas.addEventListener('mousemove',  draw);
    canvas.addEventListener('mouseup',    endDraw);
    canvas.addEventListener('mouseleave', endDraw);

    canvas.addEventListener('touchstart', e => { e.preventDefault(); startDraw(e); }, { passive: false });
    canvas.addEventListener('touchmove',  e => { e.preventDefault(); draw(e); },      { passive: false });
    canvas.addEventListener('touchend',   endDraw);
})();

function clearSignature() {
    const canvas = document.getElementById('sig-canvas');
    canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
}

function getSignatureDataUrl() {
    const canvas = document.getElementById('sig-canvas');
    const blank  = document.createElement('canvas');
    blank.width  = canvas.width;
    blank.height = canvas.height;
    if (canvas.toDataURL() === blank.toDataURL()) return null;
    return canvas.toDataURL('image/png');
}

/* ── Contacts DB & Autocomplete ── */
const SHEETS_API = 'https://script.google.com/macros/s/AKfycbxy_ApQma-kWOy05t8XaoukNeIr44z9KluSRdw4niWlX-9MbERgC1P9o9alMA3KH4o5/exec';
let CONTACTS_DB = {};

fetch(SHEETS_API)
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(rows => {
    rows.forEach(row => {
      if (!row.company) return;
      if (!CONTACTS_DB[row.company]) CONTACTS_DB[row.company] = [];
      CONTACTS_DB[row.company].push({ n: row.name, p: row.phone, e: row.email });
    });
  })
  .catch(() => {
    CONTACTS_DB = _OLD_CONTACTS_DB;
    toast('⚠ טעינת אנשי קשר מהגיליון נכשלה — מוצגת רשימה ישנה בלבד');
  });

function saveNewContact(company, name, phone, email) {
  if (!name || !company) return;
  fetch(SHEETS_API, {
    method: 'POST',
    body: JSON.stringify({ company, name, phone, email })
  })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); })
    .catch(() => { toast('⚠ שמירת "' + name + '" למאגר נכשלה — בדוק את הגיליון'); });
  if (!CONTACTS_DB[company]) CONTACTS_DB[company] = [];
  CONTACTS_DB[company].push({ n: name, p: phone, e: email });
}

// Strips invisible bidi/formatting marks (e.g. left over from copy-pasting RTL text)
// and collapses whitespace, so visually-identical strings compare equal.
function normalizeForMatch(s) {
    return (s || '').replace(/[\u200B-\u200F\u202A-\u202E\u2060-\u206F\uFEFF]/g, '').replace(/\s+/g, ' ').trim();
}

// Resolves a typed/partial/copy-pasted company name to its full existing CONTACTS_DB
// key, so saving still lands on the right company even if the field's raw text has
// stray invisible characters or is only part of the full name.
function resolveCompanyName(typed) {
    if (CONTACTS_DB[typed]) return typed;
    const keys = Object.keys(CONTACTS_DB);
    const normTyped = normalizeForMatch(typed);
    const exact = keys.find(k => normalizeForMatch(k) === normTyped);
    if (exact) return exact;
    const matches = keys.filter(k => normalizeForMatch(k).includes(normTyped));
    return matches.length === 1 ? matches[0] : typed;
}

// Auto-saves the client/contacts typed in the form to CONTACTS_DB if not already known
function saveNewContactsFromForm() {
    const typed = v('f-client');
    if (!typed) return;
    const company = resolveCompanyName(typed);
    const existing = CONTACTS_DB[company] || [];
    collectContacts().forEach(c => {
        if (!c.name || existing.some(e => e.n === c.name)) return;
        saveNewContact(company, c.name, c.phone, c.email);

function acNavigate(input, box, onSelect) {
    input.addEventListener('keydown', function(e) {
        const items = box.querySelectorAll('.ac-item');
        if (!items.length || box.style.display === 'none') return;
        const active = box.querySelector('.ac-active');
        let idx = active ? [...items].indexOf(active) : -1;
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (active) active.classList.remove('ac-active');
            idx = (idx + 1) % items.length;
            items[idx].classList.add('ac-active');
            items[idx].scrollIntoView({ block: 'nearest' });
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (active) active.classList.remove('ac-active');
            idx = (idx - 1 + items.length) % items.length;
            items[idx].classList.add('ac-active');
            items[idx].scrollIntoView({ block: 'nearest' });
        } else if (e.key === 'Enter' && active) {
            e.preventDefault();
            onSelect(active);
        } else if (e.key === 'Escape') {
            box.style.display = 'none';
        }
    });
}

function onClientInput(val) {
    const input = document.getElementById('f-client');
    const box = document.getElementById('client-ac');
    const matches = Object.keys(CONTACTS_DB).filter(k => k.includes(val.trim()));
    if (!val.trim() || !matches.length) { box.style.display = 'none'; return; }
    box.innerHTML = matches.map(m => '<div class="ac-item">' + m + '</div>').join('');
    box.style.display = 'block';
    box.onmousedown = function(e) {
        const item = e.target.closest('.ac-item');
        if (!item) return;
        e.preventDefault();
        selectClient(item.textContent.trim());
    };
    if (!input._acInit) {
        input._acInit = true;
        acNavigate(input, box, item => selectClient(item.textContent.trim()));
    }
}

function selectClient(name) {
    document.getElementById('f-client').value = name;
    document.getElementById('client-ac').style.display = 'none';
    syncContactsFromDOM();
    renderContacts();
}

const _ctMatches = {};

function onContactInput(input, idx) {
    const client = (document.getElementById('f-client').value || '').trim();
    const dbList = CONTACTS_DB[client] || [];
    const val = input.value;
    const box = document.getElementById('ct-ac-' + idx);
    const matches = dbList.filter(c => c.n.includes(val));
    _ctMatches[idx] = matches;
    if (!val || !matches.length) { box.style.display = 'none'; return; }
    box.innerHTML = matches.slice(0,30).map((c, mi) =>
        '<div class="ac-item" data-mi="' + mi + '">' + c.n + (c.p ? ' — ' + c.p : '') + '</div>'
    ).join('');
    box.style.display = 'block';
    box.onmousedown = function(e) {
        const item = e.target.closest('.ac-item');
        if (!item) return;
        e.preventDefault();
        const c = (_ctMatches[idx] || [])[parseInt(item.dataset.mi)];
        if (!c) return;
        document.getElementById('ct-name-' + idx).value = c.n;
        document.getElementById('ct-phone-' + idx).value = c.p || '';
        document.getElementById('ct-email-' + idx).value = c.e || '';
        box.style.display = 'none';
        syncContactsFromDOM();
    };
    if (!input._acInit) {
        input._acInit = true;
        acNavigate(input, box, item => {
            const mi = parseInt(item.dataset.mi);
            const c = (_ctMatches[idx] || [])[mi];
            if (!c) return;
            document.getElementById('ct-name-' + idx).value = c.n;
            document.getElementById('ct-phone-' + idx).value = c.p || '';
            document.getElementById('ct-email-' + idx).value = c.e || '';
            box.style.display = 'none';
            syncContactsFromDOM();
        });
    }
}

function selectContact(idx, mi) {
    const c = (_ctMatches[idx] || [])[mi];
    if (!c) return;
    document.getElementById('ct-name-' + idx).value = c.n;
    document.getElementById('ct-phone-' + idx).value = c.p || '';
    document.getElementById('ct-email-' + idx).value = c.e || '';
    document.getElementById('ct-ac-' + idx).style.display = 'none';
    syncContactsFromDOM();
}

function syncContactsFromDOM() {
    const rows = document.querySelectorAll('.contact-row');
    formContacts = [...rows].map(row => {
        const ins = row.querySelectorAll('input');
        return { name: ins[0].value.trim(), phone: ins[1].value.trim(), email: ins[2].value.trim() };

}

            wtDate = `${d}/${m}/${y.slice(2)}`;
        }
        const job = {
            id: Date.now(),
            num: counter,
            date: wtDate,
            cust: v('f-client'),
            proj: v('f-site'),
            desc: jobName(),
            status: 'open',
            notes: 'נשלח מהטופס' + (wnum() ? ' | ' + wnum() : '')
        };
        jobs.unshift(job);
        localStorage.setItem('wt_v4', JSON.stringify(jobs));
        localStorage.setItem('wt_cnt4', String(counter));
    } catch (e) { /* localStorage unavailable — skip silently */ }
}

function pdfFileName() {
    const raw = jobName();
    const safe = raw.replace(/[\\/:*?"<>|]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80);
    return (safe || 'טופס הזמנת עבודה')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function downloadPDF() {
    saveNewContactsFromForm();
    const content = buildPdfHTML();
    const win = window.open('', '_blank');
    win.document.write(`<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<title>${pdfFileName()}</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&display=swap" rel="stylesheet">
<style>
  * {
    font-family: 'Heebo', Arial, sans-serif !important;
    box-sizing: border-box;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  body { margin: 0; padding: 0; background: #fff; direction: rtl; }
  @media print { @page { margin: 12mm 10mm; } }
</style>
</head>
<body>
${content}
<script>
  window.addEventListener('load', function() {
    setTimeout(function() {
      window.print();
      window.onafterprint = function() { window.close(); };
    }, 400);
  });
<\/script>
</body>
</html>`);
    win.document.close();
    toast('שמור כ-PDF בחלון שנפתח ✓');
}

/* ── Email ── */
function buildEmailBody() {
    const rows     = collectRows().filter(r => r.desc || r.qty);
    const rowLines = rows.map(r =>
        `${r.n}. ${r.desc}${r.qty ? ' | כמות: ' + r.qty : ''}${r.notes ? ' | ' + r.notes : ''}`
    ).join('\n');
    const cts = collectContacts().filter(c => c.name);
    const ctLines = cts.map(c =>
        `${c.name}${c.phone ? '  ' + c.phone : ''}${c.email ? '  ' + c.email : ''}`
    ).join('\n             ');

    return `שלום גל,

מצורפת הזמנת עבודה פנימית לביצוע. אנא ראה PDF מצורף.

בברכה,
${v('f-from')}`;
}

function sendEmail() {
    saveNewContactsFromForm();
    pushToWorkTracker();
    const subject = encodeURIComponent(
        `הזמנת עבודה – ${v('f-client')} – ${v('f-site') || 'ללא פרויקט'} – ${v('f-wnum') ? 'PR' + v('f-wnum') : ''}`
    );
    const body = encodeURIComponent(buildEmailBody());
    window.location.href = `mailto:gal@smdrtech.co.il?subject=${subject}&body=${body}`;
}
</script>
